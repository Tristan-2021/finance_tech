name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - run: dart pub global activate melos 8.9.0
      - run: melos bootstrap

      - name: analyze
        run: melos exec -- flutter analyze

      - name: test changed packages
        run: melos exec --diff=origin/main...HEAD --include-dependents -- flutter test