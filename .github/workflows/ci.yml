name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - run: dart pub global activate melos 8.9.0
      - run: melos bootstrap

      - name: analyze
        run: melos exec -- flutter analyze

      - name: test changed packages
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            REF="origin/${{ github.base_ref }}...HEAD"
          elif [ "${{ github.event.before }}" = "0000000000000000000000000000000000000000" ]; then
            melos exec --dir-exists=test -- flutter test --exclude-tags integration
            exit 0
          else
            REF="${{ github.event.before }}"
          fi
          melos exec --diff="$REF" --include-dependents --dir-exists=test -- flutter test --exclude-tags integration